name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install pytest numpy pyyaml && python -m pytest -q test
      - name: tag matches package version
        run: test "v$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' package.xml)" = "${GITHUB_REF_NAME}"
      - run: test "v$(python3 -c "import re;print(re.search(r\"version='([^']+)'\", open('setup.py').read()).group(1))")" = "${GITHUB_REF_NAME}"
      - run: git archive --prefix=nav_explore_eval/ -o "$RUNNER_TEMP/nav_explore_eval-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/nav_explore_eval-*.tar.gz
          body_path: CHANGELOG.md
  pypi:
    needs: release
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
