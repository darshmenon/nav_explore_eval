name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install pytest numpy pyyaml matplotlib && python -m pytest -q test
      - name: results and leaderboard are valid and up to date
        run: |
          python -m nav_explore_eval.cli validate results/*.json
          python -m nav_explore_eval.cli leaderboard results --out LEADERBOARD.md --check
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [humble, jazzy, kilted]
    container: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: colcon build + test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          mkdir -p /tmp/ws/src && cp -r "$GITHUB_WORKSPACE" /tmp/ws/src/nav_explore_eval && cd /tmp/ws
          colcon build --packages-select nav_explore_eval
          source install/setup.bash && ros2 run nav_explore_eval nav_explore_eval --version
          cd src/nav_explore_eval && (python3 -m pytest --version >/dev/null 2>&1 || apt-get update -qq && apt-get install -y -qq python3-pytest) && python3 -m pytest -q test
